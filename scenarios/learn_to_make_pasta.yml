# To be used with GreenIT Analysis CLI
- name: Apprendre à faire des pâtes
  url: http://localhost/
  # wait for the last row of cards: the whole catalogue is rendered by then
  waitForSelector: main.container > div.grid:last-child
  actions:
    - name: Ouvrir le tutoriel
      type: click
      element: article a
      pageChange: true
      waitForSelector: h3
    - name: Lire la fiche pratique
      type: scroll
    - name: Revenir à l'accueil
      type: click
      element: '#root > header a'
      pageChange: true
      waitForSelector: main.container > div.grid:last-child
