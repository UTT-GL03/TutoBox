<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1060" width="100%" height="100%">
  <defs>
    <style>
      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .page-border {
        stroke: #1D5987;
        stroke-width: 2;
        fill: #FFFFFF;
      }
      .page-label {
        font-size: 16px;
        font-weight: 700;
        fill: #1D5987;
      }
      .comp-border {
        stroke: #B3262E;
        stroke-width: 1.8;
        fill: #FFFFFF;
      }
      .comp-label {
        font-size: 14px;
        font-weight: 600;
        fill: #B3262E;
      }
      .elem-border {
        stroke: #111827;
        stroke-width: 1.5;
        fill: #FFFFFF;
      }
      .elem-label {
        font-size: 12px;
        font-weight: 600;
        fill: #111827;
      }
      .elem-pill {
        stroke: #111827;
        stroke-width: 1.4;
        fill: #FFFFFF;
      }
      .mask-bg {
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1440" height="1060" fill="#FFFFFF"/>

  <!-- ==================== CADRE GLOBAL : PAGE CONSULTATION ==================== -->
  <g id="page-container">
    <rect x="40" y="30" width="1360" height="1000" rx="10" class="page-border"/>
    <rect x="65" y="20" width="220" height="20" class="mask-bg"/>
    <text x="75" y="35" class="page-label">Consultation de tutoriel</text>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : HEADER ==================== -->
  <g id="header-component">
    <rect x="70" y="58" width="1300" height="74" rx="8" class="comp-border"/>
    <rect x="92" y="49" width="85" height="18" class="mask-bg"/>
    <text x="98" y="62" class="comp-label">Header</text>

    <!-- Logo / Identité -->
    <rect x="95" y="76" width="320" height="42" rx="6" class="elem-border"/>
    <text x="255" y="102" text-anchor="middle" class="elem-label">Logo / Identité</text>

    <!-- Indicateur d'impact -->
    <rect x="790" y="76" width="250" height="42" rx="21" class="elem-border"/>
    <text x="915" y="102" text-anchor="middle" class="elem-label">Indicateur d'impact</text>

    <!-- Compte / Authentification -->
    <rect x="1060" y="76" width="280" height="42" rx="6" class="elem-border"/>
    <text x="1200" y="102" text-anchor="middle" class="elem-label">Compte / Authentification</text>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : LECTEUR VIDÉO ==================== -->
  <g id="video-player-component">
    <rect x="70" y="148" width="1300" height="280" rx="8" class="comp-border"/>
    <rect x="92" y="139" width="125" height="18" class="mask-bg"/>
    <text x="98" y="152" class="comp-label">Lecteur vidéo</text>

    <!-- Zone de diffusion vidéo -->
    <rect x="95" y="168" width="1250" height="165" rx="6" class="elem-border"/>
    <text x="720" y="258" text-anchor="middle" class="elem-label">Zone de diffusion vidéo</text>

    <!-- Contrôles du lecteur vidéo -->
    <g transform="translate(95, 348)">
      <rect x="0" y="0" width="1250" height="65" rx="6" class="elem-border"/>

      <!-- Lecture / Pause -->
      <rect x="20" y="14" width="200" height="36" rx="18" class="elem-pill"/>
      <text x="120" y="37" text-anchor="middle" class="elem-label">Lecture / Pause</text>

      <!-- Barre de progression -->
      <rect x="235" y="14" width="480" height="36" rx="6" class="elem-border"/>
      <text x="475" y="37" text-anchor="middle" class="elem-label">Barre de progression</text>

      <!-- Bascule audio seul -->
      <rect x="730" y="14" width="240" height="36" rx="18" class="elem-pill"/>
      <text x="850" y="37" text-anchor="middle" class="elem-label">Bascule flux audio seul</text>

      <!-- Sélecteur de résolution -->
      <rect x="985" y="14" width="245" height="36" rx="18" class="elem-pill"/>
      <text x="1107" y="37" text-anchor="middle" class="elem-label">Sélecteur de résolution</text>
    </g>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : MÉTADONNÉES & IMPACT ==================== -->
  <g id="metadata-impact-component">
    <rect x="70" y="445" width="1300" height="120" rx="8" class="comp-border"/>
    <rect x="92" y="436" width="210" height="18" class="mask-bg"/>
    <text x="98" y="449" class="comp-label">Métadonnées &amp; Impact</text>

    <!-- Métadonnées du tutoriel -->
    <rect x="95" y="465" width="615" height="85" rx="6" class="elem-border"/>
    <text x="402" y="500" text-anchor="middle" class="elem-label">Titre du tutoriel &amp; Informations créateur</text>
    <text x="402" y="526" text-anchor="middle" class="elem-label">Évaluation communautaire</text>

    <!-- Tableau de bord d'impact écologique -->
    <rect x="730" y="465" width="615" height="85" rx="6" class="elem-border"/>
    <text x="1037" y="500" text-anchor="middle" class="elem-label">Tableau de bord d'impact écologique</text>
    <text x="1037" y="526" text-anchor="middle" class="elem-label">Bilan de transfert &amp; Émissions évitées</text>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : FICHE PRATIQUE SYNTHÉTIQUE ==================== -->
  <g id="written-guide-component">
    <rect x="70" y="580" width="1300" height="215" rx="8" class="comp-border"/>
    <rect x="92" y="571" width="220" height="18" class="mask-bg"/>
    <text x="98" y="584" class="comp-label">Fiche pratique synthétique</text>

    <!-- Accès alternatif sans vidéo -->
    <rect x="95" y="600" width="1250" height="34" rx="4" class="elem-border"/>
    <text x="720" y="622" text-anchor="middle" class="elem-label">Option de consultation sobre : Guide textuel (Sans chargement vidéo)</text>

    <!-- Étapes génériques de la fiche -->
    <g transform="translate(95, 646)">
      <rect x="0" y="0" width="238" height="135" rx="6" class="elem-border"/>
      <text x="119" y="74" text-anchor="middle" class="elem-label">Étape 1</text>

      <rect x="253" y="0" width="238" height="135" rx="6" class="elem-border"/>
      <text x="372" y="74" text-anchor="middle" class="elem-label">Étape 2</text>

      <rect x="506" y="0" width="238" height="135" rx="6" class="elem-border"/>
      <text x="625" y="74" text-anchor="middle" class="elem-label">Étape 3</text>

      <rect x="759" y="0" width="238" height="135" rx="6" class="elem-border"/>
      <text x="878" y="74" text-anchor="middle" class="elem-label">Étape 4</text>

      <rect x="1012" y="0" width="238" height="135" rx="6" class="elem-border"/>
      <text x="1131" y="74" text-anchor="middle" class="elem-label">Étape 5</text>
    </g>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : ESPACE COMMUNAUTAIRE ==================== -->
  <g id="community-component">
    <rect x="70" y="810" width="1300" height="165" rx="8" class="comp-border"/>
    <rect x="92" y="801" width="195" height="18" class="mask-bg"/>
    <text x="98" y="814" class="comp-label">Espace communautaire</text>

    <!-- Zone de contribution -->
    <rect x="95" y="830" width="1250" height="42" rx="6" class="elem-border"/>
    <text x="720" y="856" text-anchor="middle" class="elem-label">Formulaire de contribution textuelle</text>

    <!-- Retours et réponses -->
    <g transform="translate(95, 882)">
      <rect x="0" y="0" width="615" height="78" rx="6" class="elem-border"/>
      <text x="307" y="45" text-anchor="middle" class="elem-label">Commentaire apprenant</text>

      <rect x="635" y="0" width="615" height="78" rx="6" class="elem-border"/>
      <text x="942" y="45" text-anchor="middle" class="elem-label">Réponse créateur</text>
    </g>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : FOOTER ==================== -->
  <g id="footer-component">
    <rect x="70" y="990" width="1300" height="30" rx="6" class="elem-border"/>
    <text x="720" y="1010" text-anchor="middle" class="elem-label">Pied de page (Mentions légales &amp; Modèle économique)</text>
  </g>
</svg>
