<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <style>
      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .page-border {
        stroke: #1D5987;
        stroke-width: 2;
        fill: #FFFFFF;
      }
      .page-label {
        font-size: 16px;
        font-weight: 700;
        fill: #1D5987;
      }
      .comp-border {
        stroke: #B3262E;
        stroke-width: 1.8;
        fill: #FFFFFF;
      }
      .comp-label {
        font-size: 14px;
        font-weight: 600;
        fill: #B3262E;
      }
      .elem-border {
        stroke: #111827;
        stroke-width: 1.5;
        fill: #FFFFFF;
      }
      .elem-label {
        font-size: 13px;
        font-weight: 600;
        fill: #111827;
      }
      .mask-bg {
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#FFFFFF"/>

  <!-- ==================== CADRE GLOBAL : POINT D'ENTRÉE ==================== -->
  <g id="page-container">
    <rect x="40" y="30" width="1360" height="840" rx="10" class="page-border"/>
    <rect x="65" y="20" width="135" height="20" class="mask-bg"/>
    <text x="75" y="35" class="page-label">Point d'entrée</text>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : HEADER ==================== -->
  <g id="header-component">
    <rect x="70" y="60" width="1300" height="75" rx="8" class="comp-border"/>
    <rect x="92" y="51" width="85" height="18" class="mask-bg"/>
    <text x="98" y="64" class="comp-label">Header</text>

    <!-- Logo / Identité -->
    <rect x="95" y="80" width="320" height="38" rx="6" class="elem-border"/>
    <text x="255" y="104" text-anchor="middle" class="elem-label">Logo / Identité</text>

    <!-- Indicateur d'impact -->
    <rect x="790" y="80" width="250" height="38" rx="19" class="elem-border"/>
    <text x="915" y="104" text-anchor="middle" class="elem-label">Indicateur d'impact</text>

    <!-- Compte / Authentification -->
    <rect x="1060" y="80" width="280" height="38" rx="6" class="elem-border"/>
    <text x="1200" y="104" text-anchor="middle" class="elem-label">Compte / Authentification</text>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : RECHERCHE CENTRALE ==================== -->
  <g id="search-section-component">
    <rect x="70" y="160" width="1300" height="350" rx="8" class="comp-border"/>
    <rect x="92" y="151" width="155" height="18" class="mask-bg"/>
    <text x="98" y="164" class="comp-label">Recherche centrale</text>

    <!-- Titre du service -->
    <rect x="95" y="185" width="1250" height="50" rx="6" class="elem-border"/>
    <text x="720" y="216" text-anchor="middle" class="elem-label">Titre du service</text>

    <!-- Formulaire de recherche -->
    <g id="search-form">
      <rect x="95" y="255" width="1250" height="90" rx="6" class="comp-border"/>
      <rect x="115" y="246" width="195" height="18" class="mask-bg"/>
      <text x="120" y="259" class="comp-label">Formulaire de recherche</text>

      <!-- Champ de saisie -->
      <rect x="120" y="280" width="940" height="46" rx="6" class="elem-border"/>
      <text x="590" y="309" text-anchor="middle" class="elem-label">Champ de recherche</text>

      <!-- Bouton de validation -->
      <rect x="1080" y="280" width="240" height="46" rx="6" class="elem-border"/>
      <text x="1200" y="309" text-anchor="middle" class="elem-label">Bouton de recherche</text>
    </g>

    <!-- Rubriques thématiques -->
    <g id="categories">
      <rect x="95" y="370" width="1250" height="115" rx="6" class="comp-border"/>
      <rect x="115" y="361" width="180" height="18" class="mask-bg"/>
      <text x="120" y="374" class="comp-label">Rubriques thématiques</text>

      <!-- Pills de rubriques sans aucun exemple -->
      <g transform="translate(120, 400)">
        <rect x="0" y="0" width="280" height="50" rx="25" class="elem-border"/>
        <text x="140" y="31" text-anchor="middle" class="elem-label">Rubrique</text>

        <rect x="305" y="0" width="280" height="50" rx="25" class="elem-border"/>
        <text x="445" y="31" text-anchor="middle" class="elem-label">Rubrique</text>

        <rect x="610" y="0" width="280" height="50" rx="25" class="elem-border"/>
        <text x="750" y="31" text-anchor="middle" class="elem-label">Rubrique</text>

        <rect x="915" y="0" width="285" height="50" rx="25" class="elem-border"/>
        <text x="1057" y="31" text-anchor="middle" class="elem-label">Rubrique</text>
      </g>
    </g>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : ENGAGEMENTS DE SOBRIÉTÉ ==================== -->
  <g id="commitments-component">
    <rect x="70" y="535" width="1300" height="185" rx="8" class="comp-border"/>
    <rect x="92" y="526" width="205" height="18" class="mask-bg"/>
    <text x="98" y="539" class="comp-label">Engagements de sobriété</text>

    <!-- Engagement 1 -->
    <rect x="95" y="565" width="390" height="130" rx="6" class="elem-border"/>
    <text x="290" y="635" text-anchor="middle" class="elem-label">Engagement : Zéro publicité</text>

    <!-- Engagement 2 -->
    <rect x="525" y="565" width="390" height="130" rx="6" class="elem-border"/>
    <text x="720" y="635" text-anchor="middle" class="elem-label">Engagement : Diffusion sobre</text>

    <!-- Engagement 3 -->
    <rect x="955" y="565" width="390" height="130" rx="6" class="elem-border"/>
    <text x="1150" y="635" text-anchor="middle" class="elem-label">Engagement : Sobriété cognitive</text>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : PIED DE PAGE ==================== -->
  <g id="footer-component">
    <rect x="70" y="745" width="1300" height="100" rx="8" class="comp-border"/>
    <rect x="92" y="736" width="110" height="18" class="mask-bg"/>
    <text x="98" y="749" class="comp-label">Pied de page</text>

    <!-- Mentions légales -->
    <rect x="95" y="770" width="620" height="55" rx="6" class="elem-border"/>
    <text x="405" y="803" text-anchor="middle" class="elem-label">Mentions légales &amp; Éco-conception</text>

    <!-- Modèle économique -->
    <rect x="745" y="770" width="600" height="55" rx="6" class="elem-border"/>
    <text x="1045" y="803" text-anchor="middle" class="elem-label">Modèle économique</text>
  </g>
</svg>
