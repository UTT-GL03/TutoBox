<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="100%" height="100%">
  <defs>
    <style>
      text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .page-border {
        stroke: #1D5987;
        stroke-width: 2;
        fill: #FFFFFF;
      }
      .page-label {
        font-size: 16px;
        font-weight: 700;
        fill: #1D5987;
      }
      .comp-border {
        stroke: #B3262E;
        stroke-width: 1.8;
        fill: #FFFFFF;
      }
      .comp-label {
        font-size: 14px;
        font-weight: 600;
        fill: #B3262E;
      }
      .elem-border {
        stroke: #111827;
        stroke-width: 1.5;
        fill: #FFFFFF;
      }
      .elem-label {
        font-size: 12px;
        font-weight: 600;
        fill: #111827;
      }
      .elem-pill {
        stroke: #111827;
        stroke-width: 1.4;
        fill: #FFFFFF;
      }
      .mask-bg {
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1440" height="980" fill="#FFFFFF"/>

  <!-- ==================== CADRE GLOBAL : PAGE RECHERCHE ==================== -->
  <g id="page-container">
    <rect x="40" y="30" width="1360" height="920" rx="10" class="page-border"/>
    <rect x="65" y="20" width="185" height="20" class="mask-bg"/>
    <text x="75" y="35" class="page-label">Recherche et filtrage</text>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : HEADER ==================== -->
  <g id="header-component">
    <rect x="70" y="58" width="1300" height="74" rx="8" class="comp-border"/>
    <rect x="92" y="49" width="85" height="18" class="mask-bg"/>
    <text x="98" y="62" class="comp-label">Header</text>

    <!-- Logo / Identité -->
    <rect x="95" y="76" width="320" height="42" rx="6" class="elem-border"/>
    <text x="255" y="102" text-anchor="middle" class="elem-label">Logo / Identité</text>

    <!-- Indicateur d'impact -->
    <rect x="790" y="76" width="250" height="42" rx="21" class="elem-border"/>
    <text x="915" y="102" text-anchor="middle" class="elem-label">Indicateur d'impact</text>

    <!-- Compte / Authentification -->
    <rect x="1060" y="76" width="280" height="42" rx="6" class="elem-border"/>
    <text x="1200" y="102" text-anchor="middle" class="elem-label">Compte / Authentification</text>
  </g>

  <!-- ==================== COMPOSANT MÉTIER : MODULE DE RECHERCHE & FILTRES ==================== -->
  <g id="search-filters-component">
    <rect x="70" y="148" width="1300" height="124" rx="8" class="comp-border"/>
    <rect x="92" y="139" width="230" height="18" class="mask-bg"/>
    <text x="98" y="152" class="comp-label">Module de recherche &amp; Filtres</text>

    <!-- Champ de recherche et bouton -->
    <rect x="95" y="168" width="960" height="40" rx="6" class="elem-border"/>
    <text x="575" y="193" text-anchor="middle" class="elem-label">Champ de recherche</text>

    <rect x="1070" y="168" width="270" height="40" rx="6" class="elem-border"/>
    <text x="1205" y="193" text-anchor="middle" class="elem-label">Bouton de recherche</text>

    <!-- Filtres métiers -->
    <g transform="translate(95, 220)">
      <rect x="0" y="0" width="280" height="38" rx="19" class="elem-pill"/>
      <text x="140" y="24" text-anchor="middle" class="elem-label">Filtre : Résolution</text>

      <rect x="295" y="0" width="280" height="38" rx="19" class="elem-pill"/>
      <text x="435" y="24" text-anchor="middle" class="elem-label">Filtre : Format</text>

      <rect x="590" y="0" width="280" height="38" rx="19" class="elem-pill"/>
      <text x="730" y="24" text-anchor="middle" class="elem-label">Filtre : Durée</text>

      <rect x="885" y="0" width="360" height="38" rx="19" class="elem-pill"/>
      <text x="1065" y="24" text-anchor="middle" class="elem-label">Tri : Impact environnemental</text>
    </g>
  </g>

