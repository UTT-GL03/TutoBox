<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap');
      
      * {
        box-sizing: border-box;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .bg { fill: #F9FAF9; }
      .header-bg { fill: #FFFFFF; }
      .card-bg { fill: #FFFFFF; }
      .border-line { stroke: #E5E9E5; stroke-width: 1; }
      
      /* Typography */
      .brand-title { font-size: 20px; font-weight: 700; fill: #1B4332; }
      .brand-subtitle { font-size: 11px; font-weight: 500; fill: #52796F; }
      
      .query-text { font-size: 15px; font-weight: 500; fill: #1F2937; }
      .filter-label { font-size: 13px; font-weight: 600; fill: #374151; }
      .filter-btn-text { font-size: 13px; font-weight: 500; fill: #4B5563; }
      .filter-btn-active { font-size: 13px; font-weight: 600; fill: #1B4332; }
      
      .results-count { font-size: 14px; font-weight: 600; fill: #1B4332; }
      .results-sub { font-size: 13px; fill: #6B7280; }
      
      .card-title { font-size: 15px; font-weight: 600; fill: #111827; }
      .card-author { font-size: 12px; font-weight: 500; fill: #4B5563; }
      .card-meta { font-size: 12px; fill: #6B7280; }
      .card-data-badge { font-size: 11px; font-weight: 600; fill: #2D6A4F; }
      
      .page-btn { font-size: 13px; font-weight: 500; fill: #374151; }
      .page-btn-active { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      
      .eco-badge-text { font-size: 12px; font-weight: 600; fill: #1B4332; }
      .footer-text { font-size: 12px; fill: #718096; }
    </style>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1B4332" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1440" height="900" class="bg"/>

