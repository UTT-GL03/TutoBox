name: Test
on:
  push:

jobs:

  build_samples:
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v5
      - name: Generate sample
        run: |-
          npx --yes dummy-json sample_data.hbs > sample_data.json
      - name: Save samples for later
        uses: actions/upload-artifact@v4
        with:
          name: samples
          path: sample_data.json

  build:
    needs:
      - build_samples
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v5
      - name: Set up NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Get samples
        uses: actions/download-artifact@v4
        with:
          name: samples
          path: frontend/public
      - name: Install frontend dependencies
        run: |-
          cd frontend
          npm ci
      - name: Build frontend
        run: |-
          cd frontend
          npm run build
      - name: Save frontend build for later
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  serve:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v5
      - name: Start application
        uses: ./.github/actions/start
      - name: Check the application is served by nginx
        run: |-
          curl --fail --silent --show-error http://localhost/sample_data.json > /dev/null
          curl --fail --silent --show-error http://localhost/tutorials/1 > /dev/null
          echo "Home page and tutorial page (SPA fallback) are both answered."
      - name: Show containers status
        run: docker compose ps
      - name: Stop containers
        if: always()
        run: docker compose down

  measure_ecoindex:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v5
      - name: Start application
        uses: ./.github/actions/start
      - name: Install GreenIT Analysis CLI
        run: |-
          git clone --depth 1 https://github.com/cnumr/GreenIT-Analysis-cli.git
          cd GreenIT-Analysis-cli
          npm install
          node builder.js # the bundle is normally built by the postinstall script
          npm link
      - name: Run GreenIT Analysis CLI
        run: |-
          greenit analyse scenarios/learn_to_make_pasta.yml EcoIndex.html --format html --ci
      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: EcoIndex
          path: '*.html'
      - name: Stop containers
        if: always()
        run: docker compose down
